name: Holdings and Market Digest

on:
  schedule:
    # GitHub Actions runs scheduled jobs on a best-effort basis and is often
    # LATE — sometimes by hours — especially on the hour and half hour. So:
    #   * exactly ONE cron per edition (a delayed run still sends, never skips)
    #   * odd minutes, off the peak, to reduce queue delay
    # Cron is UTC and does not follow daylight saving, so Eastern arrival
    # shifts by an hour between EDT and EST. That is the accepted tradeoff for
    # never missing a send.
    - cron: "7 13 * * 1-5"    # ~9:07am EDT / 8:07am EST — morning edition
    - cron: "7 21 * * 1-5"    # ~5:07pm EDT / 4:07pm EST — evening edition
  workflow_dispatch: {}       # manual run from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}   # optional; blank falls back to sender
        run: python main.py
